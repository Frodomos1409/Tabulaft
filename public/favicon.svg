<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2830eb"/>
      <stop offset="100%" stop-color="#0e14a0"/>
    </linearGradient>
    <!-- Sombra suave para dar profundidad al bookmark -->
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <!-- Fondo redondeado azul -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- "T" blanca — barra horizontal que va hasta el bookmark -->
  <rect x="3" y="9" width="22" height="5.5" rx="1.5" fill="white"/>
  <!-- Tallo vertical -->
  <rect x="8.5" y="14.5" width="5.5" height="12" rx="1.5" fill="white"/>

  <!-- Marcapáginas rojo — "pinea" la T desde la esquina superior derecha -->
  <path d="M21,0 H30 Q32,0 32,2 V19 L26.5,15.5 L21,19 Z"
        fill="#c9413a" filter="url(#sh)"/>

  <!-- Chevron blanco dentro del bookmark (detalle de marca) -->
  <path d="M23.5,8 L26.5,12 L29.5,8"
        fill="none" stroke="rgba(255,255,255,0.72)"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
