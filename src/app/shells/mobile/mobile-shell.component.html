<!-- ── TOP BAR ──────────────────────────────────────────────────── -->
<header class="mob-topbar">
  <a routerLink="/" class="mob-topbar__logo">
    TABU<span>LAFT</span><span class="mob-topbar__dot">.</span>
  </a>

  <div class="mob-topbar__actions">
    <!-- Search button -->
    <button class="mob-topbar__btn" (click)="openSearchModal()" aria-label="Buscar">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </button>

    <!-- Theme toggle -->
    <button class="mob-topbar__btn" (click)="theme.toggle()" aria-label="Cambiar tema">
      @if (theme.isDark()) {
        <!-- Sun icon for dark mode (click = switch to light) -->
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      } @else {
        <!-- Moon icon for light mode (click = switch to dark) -->
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      }
    </button>
  </div>
</header>

<!-- ── MAIN CONTENT ────────────────────────────────────────────── -->
<main class="mob-content">
  <router-outlet />
</main>

<!-- ── BOTTOM NAVIGATION ──────────────────────────────────────── -->
<nav class="mob-bottomnav">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="mob-bottomnav__item">
    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    <span>Inicio</span>
  </a>

  <a routerLink="/explorar" [queryParams]="{cat:'Diseño Gráfico'}" routerLinkActive="active" class="mob-bottomnav__item">
    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <rect x="2" y="3" width="7" height="7"/><rect x="15" y="3" width="7" height="7"/>
      <rect x="15" y="14" width="7" height="7"/><rect x="2" y="14" width="7" height="7"/>
    </svg>
    <span>Diseño</span>
  </a>

  <a routerLink="/explorar" [queryParams]="{cat:'Ilustración'}" routerLinkActive="active" class="mob-bottomnav__item">
    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
      <path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/>
    </svg>
    <span>Ilustración</span>
  </a>

  <a routerLink="/explorar" [queryParams]="{cat:'Fotografía'}" routerLinkActive="active" class="mob-bottomnav__item">
    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
    <span>Foto</span>
  </a>

  <button class="mob-bottomnav__item mob-bottomnav__more" (click)="toggleDrawer()">
    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
    </svg>
    <span>Más</span>
  </button>
</nav>

<!-- ── DRAWER BACKDROP ─────────────────────────────────────────── -->
@if (drawerOpen()) {
  <div class="mob-backdrop" (click)="closeDrawer()"></div>
}

<!-- ── DRAWER ─────────────────────────────────────────────────── -->
<div class="mob-drawer" [class.mob-drawer--open]="drawerOpen()">
  <div class="mob-drawer__handle"></div>

  <p class="mob-drawer__section-title">Categorías</p>
  <div class="mob-drawer__grid">
    <a routerLink="/explorar" [queryParams]="{cat:'Branding'}" class="mob-drawer__item" (click)="closeDrawer()">
      <span class="mob-drawer__icon">◈</span>Branding
    </a>
    <a routerLink="/explorar" [queryParams]="{cat:'UI/UX'}" class="mob-drawer__item" (click)="closeDrawer()">
      <span class="mob-drawer__icon">⬡</span>UI/UX
    </a>
    <a routerLink="/explorar" [queryParams]="{cat:'Editorial'}" class="mob-drawer__item" (click)="closeDrawer()">
      <span class="mob-drawer__icon">◻</span>Editorial
    </a>
    <a routerLink="/explorar" [queryParams]="{cat:'Tipografía'}" class="mob-drawer__item" (click)="closeDrawer()">
      <span class="mob-drawer__icon">Aa</span>Tipografía
    </a>
    <a routerLink="/explorar" [queryParams]="{cat:'Motion'}" class="mob-drawer__item" (click)="closeDrawer()">
      <span class="mob-drawer__icon">▷</span>Motion
    </a>
    <a routerLink="/explorar" class="mob-drawer__item" (click)="closeDrawer()">
      <span class="mob-drawer__icon">✦</span>Todos
    </a>
  </div>

  <div class="mob-drawer__divider"></div>

  <p class="mob-drawer__section-title">Cuenta</p>
  <a routerLink="/auth" class="mob-drawer__link" (click)="closeDrawer()">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </svg>
    Iniciar sesión
  </a>
  <a routerLink="/publicar" class="mob-drawer__link" (click)="closeDrawer()">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    Publicar proyecto
  </a>
</div>

<!-- ── SEARCH MODAL ────────────────────────────────────────────── -->
@if (searchModalOpen()) {
  <app-search-modal (close)="closeSearchModal()" />
}

<!-- ── TOAST ──────────────────────────────────────────────────── -->
<app-toast />
